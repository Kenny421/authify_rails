name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem install bundler-audit
      - run: bundle audit check --update

  generated-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite3, postgresql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTHIFY_GEM_PATH: ${{ github.workspace }}
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Generate Rails application
        run: |
          bundle exec rails new /tmp/authify_app --skip-git --skip-bundle --database=${{ matrix.database }}
          printf '\ngem "authify_rails", path: ENV.fetch("AUTHIFY_GEM_PATH")\n' >> /tmp/authify_app/Gemfile
          cd /tmp/authify_app
          if [ "${{ matrix.database }}" = "postgresql" ]; then
            echo 'DATABASE_URL=postgres://postgres:postgres@localhost:5432/authify_test' >> "$GITHUB_ENV"
            export DATABASE_URL=postgres://postgres:postgres@localhost:5432/authify_test
          fi
          bundle install
          bin/rails generate authify:install --all
          RAILS_ENV=test bin/rails db:prepare
      - name: Run generated security tests
        working-directory: /tmp/authify_app
        run: bin/rails test test/integration/authify_security_flows_test.rb test/integration/authify_oauth_security_test.rb test/integration/authify_hardening_test.rb test/integration/authify_concurrency_test.rb test/integration/authify_abuse_test.rb
      - name: Scan generated application
        working-directory: /tmp/authify_app
        run: bundle exec brakeman --no-pager --quiet

  upgrade-existing-app:
    runs-on: ubuntu-latest
    env:
      AUTHIFY_GEM_PATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Upgrade a customized 0.3.0 application
        run: script/upgrade_smoke
